name: Build Custom geosite.dat

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-custom-geosite
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: false

      - name: Get current timestamp (HKT)
        id: time
        shell: bash
        run: |
          set -euo pipefail
          echo "TIMESTAMP=$(TZ='Asia/Hong_Kong' date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Download and merge rules
        shell: bash
        run: |
          set -euo pipefail
          python convert.py

          if [ ! -d data ]; then
            echo "Error: convert.py did not create data directory."
            exit 1
          fi

          if [ -z "$(find data -maxdepth 1 -type f -print -quit)" ]; then
            echo "Error: no geosite source files were generated."
            exit 1
          fi

          find data -maxdepth 1 -type f -print | sort

      - name: Build full geosite.dat
        shell: bash
        run: |
          set -euo pipefail

          rm -rf compiler
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git compiler

          rm -rf compiler/data
          cp -r data compiler/data

          cd compiler
          go run main.go

          if [ -f dlc.dat ]; then
            mv dlc.dat ../geosite.dat
          elif [ -f geosite.dat ]; then
            mv geosite.dat ../geosite.dat
          else
            echo "Error: geosite.dat was not generated."
            exit 1
          fi

      - name: Verify geosite.dat
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s geosite.dat ]; then
            echo "Error: geosite.dat is missing or empty."
            exit 1
          fi

          ls -lh geosite.dat
          sha256sum geosite.dat | tee geosite.dat.sha256sum

      - name: Prepare selected SRS, MRS and Surge sources
        id: rulesets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ruleset-source
          mkdir -p ruleset-source/srs ruleset-source/mrs ruleset-source/surge

          python <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          config = json.loads(Path("config.json").read_text(encoding="utf-8"))
          outputs = config.get("ruleset_outputs", {}) or {}
          attr_outputs = config.get("ruleset_attr_outputs", {}) or {}

          if not isinstance(outputs, dict):
              raise TypeError("ruleset_outputs must be an object")
          if not isinstance(attr_outputs, dict):
              raise TypeError("ruleset_attr_outputs must be an object")

          data_dir = Path("data")
          srs_dir = Path("ruleset-source/srs")
          mrs_dir = Path("ruleset-source/mrs")
          surge_dir = Path("ruleset-source/surge")

          def clean_name(value):
              value = str(value).strip().lower()
              if not re.fullmatch(r"[a-z0-9_-]+", value):
                  raise ValueError(f"Invalid tag or attr name: {value}")
              return value

          def clean_list(value, field):
              if value is None:
                  return []
              if not isinstance(value, list):
                  raise TypeError(f"{field} must be an array")
              return list(dict.fromkeys(clean_name(item) for item in value))

          def clean_map(value, field):
              if value is None:
                  return {}
              if not isinstance(value, dict):
                  raise TypeError(f"{field} must be an object")
              return {
                  clean_name(tag): clean_list(attrs, f"{field}.{tag}")
                  for tag, attrs in value.items()
              }

          srs_tags = clean_list(outputs.get("srs", []), "ruleset_outputs.srs")
          mrs_tags = clean_list(outputs.get("mrs", []), "ruleset_outputs.mrs")
          surge_tags = clean_list(outputs.get("surge", []), "ruleset_outputs.surge")
          srs_attrs = clean_map(attr_outputs.get("srs", {}), "ruleset_attr_outputs.srs")
          mrs_attrs = clean_map(attr_outputs.get("mrs", {}), "ruleset_attr_outputs.mrs")
          surge_attrs = clean_map(attr_outputs.get("surge", {}), "ruleset_attr_outputs.surge")

          def load_rules(tag, required_attr=None):
              source = data_dir / tag
              if not source.is_file():
                  raise FileNotFoundError(f"Missing geosite category: {tag}")

              rules = []
              for raw_line in source.read_text(encoding="utf-8", errors="ignore").splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue

                  parts = line.split()
                  rule = parts[0]
                  attrs = {
                      part[1:].lower()
                      for part in parts[1:]
                      if part.startswith("@") and len(part) > 1
                  }

                  if required_attr and required_attr not in attrs:
                      continue

                  rules.append(rule)

              rules = list(dict.fromkeys(rules))
              if not rules:
                  suffix = f"@{required_attr}" if required_attr else ""
                  raise RuntimeError(f"No rules found for {tag}{suffix}")
              return rules

          def build_srs(rules):
              result = {
                  "domain": [],
                  "domain_suffix": [],
                  "domain_keyword": [],
                  "domain_regex": [],
              }

              for rule in rules:
                  if rule.startswith("full:"):
                      result["domain"].append(rule[5:])
                  elif rule.startswith("keyword:"):
                      result["domain_keyword"].append(rule[8:])
                  elif rule.startswith("regexp:"):
                      result["domain_regex"].append(rule[7:])
                  elif rule.startswith("domain:"):
                      result["domain_suffix"].append(rule[7:])
                  else:
                      result["domain_suffix"].append(rule)

              payload = {
                  key: list(dict.fromkeys(values))
                  for key, values in result.items()
                  if values
              }

              return {
                  "version": 2,
                  "rules": [payload],
              }

          def build_mrs_text(rules, output_name):
              output = []
              unsupported = []

              for rule in rules:
                  if rule.startswith("full:"):
                      output.append(rule[5:])
                  elif rule.startswith("domain:"):
                      output.append("+." + rule[7:])
                  elif rule.startswith("keyword:") or rule.startswith("regexp:"):
                      unsupported.append(rule)
                  else:
                      output.append("+." + rule)

              if unsupported:
                preview = ", ".join(unsupported[:5])
            
                print(
                    f"Warning: MRS skipped {len(unsupported)} "
                    f"unsupported keyword/regexp rules in {output_name}: "
                    f"{preview}"
                )

              output = list(dict.fromkeys(output))
              if not output:
                  raise RuntimeError(f"No MRS-compatible rules for {output_name}")
              return output

          def build_surge_text(rules, output_name):
              output = []
              unsupported = []

              for rule in rules:
                  if rule.startswith("full:"):
                      value = rule[5:].strip()
                      if value:
                          output.append("DOMAIN," + value)
                  elif rule.startswith("domain:"):
                      value = rule[7:].strip()
                      if value:
                          output.append("DOMAIN-SUFFIX," + value)
                  elif rule.startswith("keyword:"):
                      value = rule[8:].strip()
                      if value:
                          output.append("DOMAIN-KEYWORD," + value)
                  elif rule.startswith("regexp:"):
                      unsupported.append(rule)
                  else:
                      value = rule.strip()
                      if value:
                          output.append("DOMAIN-SUFFIX," + value)

              if unsupported:
                  preview = ", ".join(unsupported[:5])
                  print(
                      f"Warning: Surge skipped {len(unsupported)} "
                      f"unsupported regexp rules in {output_name}: "
                      f"{preview}"
                  )

              output = list(dict.fromkeys(output))

              if not output:
                  raise RuntimeError(
                      f"No Surge-compatible rules for {output_name}"
                  )

              return output

          srs_count = 0
          mrs_count = 0
          surge_count = 0

          def write_srs(name, rules):
              path = srs_dir / f"{name}.json"
              path.write_text(
                  json.dumps(build_srs(rules), ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              print(f"SRS source: {name} ({len(rules)} rules)")

          def write_mrs(name, rules):
              lines = build_mrs_text(rules, name)
              path = mrs_dir / f"{name}.txt"
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              print(f"MRS source: {name} ({len(lines)} rules)")

          def write_surge(name, rules):
              lines = build_surge_text(rules, name)
              path = surge_dir / f"{name}.list"
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              print(f"Surge source: {name} ({len(lines)} rules)")

          for tag in srs_tags:
              write_srs(tag, load_rules(tag))
              srs_count += 1

          for tag, attrs in srs_attrs.items():
              for attr in attrs:
                  write_srs(f"{tag}-{attr}", load_rules(tag, attr))
                  srs_count += 1

          for tag in mrs_tags:
              write_mrs(tag, load_rules(tag))
              mrs_count += 1

          for tag, attrs in mrs_attrs.items():
              for attr in attrs:
                  write_mrs(f"{tag}-{attr}", load_rules(tag, attr))
                  mrs_count += 1

          for tag in surge_tags:
              write_surge(tag, load_rules(tag))
              surge_count += 1

          for tag, attrs in surge_attrs.items():
              for attr in attrs:
                  write_surge(f"{tag}-{attr}", load_rules(tag, attr))
                  surge_count += 1

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"srs_count={srs_count}\n")
              output.write(f"mrs_count={mrs_count}\n")
              output.write(f"surge_count={surge_count}\n")
          PY

      - name: Install sing-box
        if: steps.rulesets.outputs.srs_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          URL="$(python <<'PY'
          import json
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/SagerNet/sing-box/releases/latest",
              headers={"User-Agent": "custom-geosite-builder"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              release = json.load(response)

          for asset in release.get("assets", []):
              name = asset.get("name", "")
              if "linux-amd64" in name and name.endswith(".tar.gz"):
                  print(asset["browser_download_url"])
                  break
          else:
              raise RuntimeError("Cannot find sing-box linux-amd64 asset")
          PY
          )"

          curl -fL "$URL" -o sing-box.tar.gz
          rm -rf sing-box-extract
          mkdir sing-box-extract
          tar -xzf sing-box.tar.gz -C sing-box-extract

          BIN="$(find sing-box-extract -type f -name sing-box -print -quit)"
          sudo install -m 0755 "$BIN" /usr/local/bin/sing-box
          sing-box version

      - name: Compile selected SRS files
        if: steps.rulesets.outputs.srs_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf srs
          mkdir srs

          for source in ruleset-source/srs/*.json; do
            [ -f "$source" ] || continue
            tag="$(basename "$source" .json)"
            sing-box rule-set compile --output "srs/${tag}.srs" "$source"
            test -s "srs/${tag}.srs"
          done

      - name: Install Mihomo
        if: steps.rulesets.outputs.mrs_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          URL="$(python <<'PY'
          import json
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest",
              headers={"User-Agent": "custom-geosite-builder"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              release = json.load(response)

          candidates = []
          for asset in release.get("assets", []):
              name = asset.get("name", "").lower()
              if "linux-amd64" not in name or not name.endswith(".gz"):
                  continue
              if any(x in name for x in ("compatible", "go120", "musl", ".deb", ".rpm")):
                  continue
              candidates.append(asset)

          if not candidates:
              raise RuntimeError("Cannot find Mihomo linux-amd64 asset")

          candidates.sort(key=lambda item: len(item["name"]))
          print(candidates[0]["browser_download_url"])
          PY
          )"

          curl -fL "$URL" -o mihomo.gz
          gzip -dc mihomo.gz > mihomo
          chmod +x mihomo
          sudo install -m 0755 mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Compile selected MRS files
        if: steps.rulesets.outputs.mrs_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf mrs
          mkdir mrs

          for source in ruleset-source/mrs/*.txt; do
            [ -f "$source" ] || continue
            tag="$(basename "$source" .txt)"
            mihomo convert-ruleset domain text "$source" "mrs/${tag}.mrs"
            test -s "mrs/${tag}.mrs"
          done

      - name: Build selected Surge files
        if: steps.rulesets.outputs.surge_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf surge
          mkdir surge

          for source in ruleset-source/surge/*.list; do
            [ -f "$source" ] || continue
            cp "$source" surge/
            test -s "surge/$(basename "$source")"
          done

      - name: Verify rule-set outputs
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SRS="${{ steps.rulesets.outputs.srs_count }}"
          EXPECTED_MRS="${{ steps.rulesets.outputs.mrs_count }}"
          EXPECTED_SURGE="${{ steps.rulesets.outputs.surge_count }}"

          ACTUAL_SRS=0
          ACTUAL_MRS=0
          ACTUAL_SURGE=0

          if [ -d srs ]; then
            ACTUAL_SRS="$(find srs -maxdepth 1 -type f -name '*.srs' | wc -l)"
          fi

          if [ -d mrs ]; then
            ACTUAL_MRS="$(find mrs -maxdepth 1 -type f -name '*.mrs' | wc -l)"
          fi

          if [ -d surge ]; then
            ACTUAL_SURGE="$(find surge -maxdepth 1 -type f -name '*.list' | wc -l)"
          fi

          echo "SRS: ${ACTUAL_SRS}/${EXPECTED_SRS}"
          echo "MRS: ${ACTUAL_MRS}/${EXPECTED_MRS}"
          echo "Surge: ${ACTUAL_SURGE}/${EXPECTED_SURGE}"

          [ "$ACTUAL_SRS" -eq "$EXPECTED_SRS" ]
          [ "$ACTUAL_MRS" -eq "$EXPECTED_MRS" ]
          [ "$ACTUAL_SURGE" -eq "$EXPECTED_SURGE" ]

      - name: Generate rule-set checksums
        shell: bash
        run: |
          set -euo pipefail

          rm -f rulesets.sha256sum

          find srs mrs surge \
            -maxdepth 1 \
            -type f \
            \( -name '*.srs' -o -name '*.mrs' -o -name '*.list' \) \
            -print0 2>/dev/null \
            | sort -z \
            | xargs -0 -r sha256sum \
            > rulesets.sha256sum

          if [ ! -s rulesets.sha256sum ]; then
            echo "No SRS, MRS or Surge outputs configured." > rulesets.sha256sum
          fi

      - name: Release files with timestamp
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.time.outputs.TIMESTAMP }}
          name: ${{ steps.time.outputs.TIMESTAMP }}
          body: |
            Auto-built custom geosite.dat, SRS, MRS and Surge rule sets.

            Build time: ${{ steps.time.outputs.TIMESTAMP }} HKT
          draft: false
          prerelease: false
          make_latest: false
          files: |
            geosite.dat
            geosite.dat.sha256sum
            rulesets.sha256sum
            srs/*.srs
            mrs/*.mrs
            surge/*.list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update fixed release tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: Latest Release
          body: |
            Always contains the latest custom geosite.dat, SRS, MRS and Surge rule sets.

            Build time: ${{ steps.time.outputs.TIMESTAMP }} HKT
          draft: false
          prerelease: false
          make_latest: true
          files: |
            geosite.dat
            geosite.dat.sha256sum
            rulesets.sha256sum
            srs/*.srs
            mrs/*.mrs
            surge/*.list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
