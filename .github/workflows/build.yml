name: Build Custom geosite.dat

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 20 * * *'  # 每天香港時間 04:00 自動更新
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 確保有權限建立與發布 Release
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Get current timestamp (HKT / UTC+8)
        id: time
        run: |
          # 取得 UTC+8 時間 (Format: YYYYMMDDHHMMSS)
          echo "TIMESTAMP=$(TZ='Asia/Hong_Kong' date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Download & Merge Rules
        run: python convert.py

      - name: Download v2fly compiler and compile
        run: |
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git compiler
          cp -r data compiler/
          cd compiler
          go run main.go
          if [ -f "dlc.dat" ]; then
            mv dlc.dat ../geosite.dat
          elif [ -f "geosite.dat" ]; then
            mv geosite.dat ../geosite.dat
          fi

      - name: Release geosite.dat (Timestamp Tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.time.outputs.TIMESTAMP }}
          name: "${{ steps.time.outputs.TIMESTAMP }}"
          body: "Auto-built geosite.dat at ${{ steps.time.outputs.TIMESTAMP }}"
          draft: false
          prerelease: false
          files: geosite.dat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Tag (For 固定訂閱網址)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: "Latest Release"
          body: "Always points to the latest geosite.dat"
          draft: false
          prerelease: false
          files: geosite.dat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
